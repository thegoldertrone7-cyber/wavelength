<!doctype html>
<html lang="en" data-theme="dark" data-style="nothing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wavelength</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/favicon.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>try{var s=JSON.parse(localStorage.getItem('wl')||'{}');if(s.theme)document.documentElement.dataset.theme=s.theme;if(s.style)document.documentElement.dataset.style=s.style;if(s.accent)document.documentElement.style.setProperty('--accent',s.accent)}catch(e){}</script>
</head>
<body>
<div class="ambient"><i></i><i></i></div>

<div class="app">
  <aside class="side card">
    <div class="logo"><span class="logo-dots"><i></i><i></i><i></i><i></i></span>Wavelength</div>
    <nav class="nav">
      <a data-go="home" data-r="home"><span data-ic="home"></span>Home</a>
      <a data-go="search" data-r="search"><span data-ic="search"></span>Search</a>
      <a data-go="library" data-r="library"><span data-ic="lib"></span>Library</a>
      <a data-go="import" data-r="import"><span data-ic="import"></span>Spotify import</a>
      <a data-go="downloads" data-r="downloads"><span data-ic="dl"></span>Downloads</a>
      <a data-go="settings" data-r="settings"><span data-ic="gear"></span>Settings</a>
    </nav>
    <div class="side-h"><span>Playlists</span><button class="ib sm" data-act="newpl" data-ic="plus" title="New playlist"></button></div>
    <div class="side-pl" id="side-pl"></div>
  </aside>

  <main class="main card" id="main">
    <header class="top">
      <label class="searchbox"><span data-ic="search"></span><input id="q" type="search" placeholder="Search any song or artist" autocomplete="off" spellcheck="false"></label>
      <nav class="mnav"><a data-go="home" data-ic="home"></a><a data-go="library" data-ic="lib"></a><a data-go="import" data-ic="import"></a><a data-go="downloads" data-ic="dl"></a><a data-go="settings" data-ic="gear"></a></nav>
    </header>
    <div id="banner"></div>
    <div class="view" id="view"></div>
  </main>
</div>

<footer class="player" id="player">
  <div class="p-left">
    <div class="p-art" id="p-art"><div class="art"><span class="art-d"></span></div></div>
    <div class="p-meta" id="p-meta"><div class="p-title" id="p-title">Nothing playing</div><div class="p-artist" id="p-artist">Pick a song to start</div></div>
    <button class="ib hrt" data-act="like" id="p-like" title="Like"></button>
  </div>
  <div class="p-center">
    <div class="ctl">
      <button class="ib" data-act="shuffle" data-ic="shuffle" title="Shuffle"></button>
      <button class="ib lg" data-act="prev" data-ic="prev" title="Previous"></button>
      <button class="pp" data-act="play" aria-label="Play or pause"><svg class="dm" viewBox="0 0 25 25"></svg><span class="pp-i"></span></button>
      <button class="ib lg" data-act="next" data-ic="next" title="Next"></button>
      <button class="ib" data-act="repeat" data-ic="repeat" id="b-repeat" title="Repeat"></button>
    </div>
    <div class="prog"><span class="tm t-cur">0:00</span><div class="dtw" data-seek><div class="dt"><i class="js-fill"></i></div></div><span class="tm t-tot">0:00</span></div>
  </div>
  <div class="p-right">
    <button class="ib" data-act="queue" data-ic="queue" title="Queue"></button>
    <button class="ib" data-act="np" data-ic="expand" title="Full screen"></button>
    <button class="ib" data-act="mute" id="b-mute" title="Mute"></button>
    <div class="dtw vol" data-vol><div class="dt"><i id="v-fill"></i></div></div>
  </div>
</footer>

<section class="np" id="np">
  <div class="np-bg"></div>
  <button class="ib x" data-act="np" data-ic="close" title="Close"></button>
  <div class="np-art" id="np-art"></div>
  <div class="np-meta"><h2 id="np-title">Nothing playing</h2><p id="np-artist"></p></div>
  <canvas id="viz"></canvas>
  <div class="prog wide"><span class="tm t-cur">0:00</span><div class="dtw" data-seek><div class="dt"><i class="js-fill"></i></div></div><span class="tm t-tot">0:00</span></div>
  <div class="ctl">
    <button class="ib" data-act="shuffle" data-ic="shuffle" title="Shuffle"></button>
    <button class="ib lg" data-act="prev" data-ic="prev" title="Previous"></button>
    <button class="pp" data-act="play" aria-label="Play or pause"><svg class="dm" viewBox="0 0 25 25"></svg><span class="pp-i"></span></button>
    <button class="ib lg" data-act="next" data-ic="next" title="Next"></button>
    <button class="ib" data-act="repeat" data-ic="repeat" title="Repeat"></button>
  </div>
  <div class="acts"><button class="btn" data-act="viz-style" id="b-viz">Matrix</button><button class="btn" data-act="queue">Queue</button></div>
</section>

<aside class="queue card" id="queue">
  <div class="q-h"><h3>Up next</h3><div><button class="btn sm" data-act="qclear">Clear</button><button class="ib" data-act="queue" data-ic="close"></button></div></div>
  <div class="q-list" id="q-list"></div>
</aside>

<div class="modal" id="modal"></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>
<script src="js/app.js"></script>
</body>
</html>
